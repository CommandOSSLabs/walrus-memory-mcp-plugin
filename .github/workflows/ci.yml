name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON manifests
        run: |
          find . -path './.git' -prune -o -name '*.json' -type f -print0 |
            xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'
      - name: Check hook scripts
        run: find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Test hook signals
        run: node --test test/*.test.mjs
      - name: Check plugin package layout
        run: |
          test -f .claude-plugin/plugin.json
          test -f .mcp.json
          test -f skills/setup/SKILL.md
          test -f commands/remember.md
          test -f commands/recall.md
          test -f hooks/hooks.json
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
          for (const path of [manifest.mcpServers, manifest.skills, manifest.commands, manifest.hooks]) {
            if (!fs.existsSync(path)) throw new Error(`Missing manifest target: ${path}`);
          }
          const mcp = JSON.parse(fs.readFileSync('.mcp.json', 'utf8'));
          const server = mcp.mcpServers?.memwal;
          const pin = server?.args?.find((arg) => arg.startsWith('@mysten-incubation/memwal-mcp@'));
          if (server?.command !== 'npx' || !pin || !/^@mysten-incubation\/memwal-mcp@\d+\.\d+\.\d+$/.test(pin)) {
            throw new Error('Plugin must pin @mysten-incubation/memwal-mcp@<semver> so npx cannot reuse a stale cache (WALM-627)');
          }
          NODE
      - name: Validate with Claude Code
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict
      - name: Gate marketplace rollout on the canonical MCP release
        run: node scripts/check_mcp_release.mjs
